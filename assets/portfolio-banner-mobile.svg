<svg width="340" height="56" viewBox="0 0 340 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="포트폴리오 — 프로젝트 상세, 스킬, 자격 등">
  <style>
    .sheen { animation: sweep 4.6s ease-in-out infinite; }
    @keyframes sweep {
      0% { transform: translateX(0); }
      62%, 100% { transform: translateX(520px); }
    }
    text { font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  </style>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#9aa4af" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#d0d7de"/>
      <stop offset="0.65" stop-color="#9aa4af" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <mask id="rim">
      <rect x="0.5" y="0.5" width="339" height="55" rx="13" fill="#ffffff"/>
      <rect x="0.5" y="4" width="336" height="51.5" rx="10" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#rim)">
    <rect x="0.5" y="0.5" width="339" height="55" rx="13" fill="#8b949e" fill-opacity="0.22" stroke="#8b949e" stroke-opacity="0.45"/>
    <rect class="sheen" x="-100" y="0" width="100" height="56" fill="url(#metal)"/>
  </g>
  <rect x="0.5" y="4" width="336" height="51.5" rx="10" fill="#8b949e" fill-opacity="0.07" stroke="#8b949e" stroke-opacity="0.45"/>
  <text x="18" y="36" font-size="18" font-weight="700" fill="#5b86c4">포트폴리오</text>
  <text x="122" y="36" font-size="13" fill="#768390">프로젝트 상세, 스킬, 자격 등</text>
  <text x="304" y="37" font-size="18" font-weight="700" fill="#5b86c4">→</text>
</svg>
