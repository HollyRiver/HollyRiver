<svg width="805" height="52" viewBox="0 0 805 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="포트폴리오 — 프로젝트 상세, 스킬, 자격 등">
  <style>
    .line { animation: slide 5s linear infinite; opacity: 0.75; }
    @keyframes slide { 0% { transform: translateX(-805px); } 55%, 100% { transform: translateX(805px); } }
    text { font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  </style>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#9aa4af"/>
      <stop offset="0.5" stop-color="#c4ccd4"/>
      <stop offset="0.65" stop-color="#9aa4af"/>
      <stop offset="1" stop-color="#6e7681" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="805" height="52" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="0.5" y="0.5" width="804" height="51" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect class="line" width="805" height="2.5" fill="url(#top)"/>
    <text x="26" y="33" font-size="17" font-weight="700" fill="#24292f">포트폴리오</text>
    <text x="122" y="33" font-size="13" fill="#57606a">프로젝트 상세, 스킬, 자격 등</text>
    <text x="756" y="34" font-size="18" font-weight="700" fill="#345995">→</text>
  </g>
</svg>
